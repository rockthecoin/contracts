name: Contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evm:
    name: EVM builds and execution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - run: npm run verify:integrity
      - run: npm run verify:builds
      - run: npm test
  solana-execution:
    name: Solana program execution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python tests/solana_controller.py
  solana-build:
    name: Solana reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Agave and platform tools
        run: |
          bash scripts/install-solana-toolchain.sh "$RUNNER_TEMP/rtc-solana"
          echo "$RUNNER_TEMP/rtc-solana/solana-release/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/rtc-solana/platform-tools/rust/bin" >> "$GITHUB_PATH"
      - run: bash scripts/rebuild-solana.sh

  tron-build:
    name: Native TRON reproducible builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: python3 scripts/install-tron-compiler.py
      - run: npm run verify:integrity
      - run: npm run verify:tron-builds

  cardano-build:
    name: Cardano Aiken checks and reproducible validators
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/verify-cardano.py
      - run: python3 scripts/install-aiken.py
      - run: python3 scripts/rebuild-cardano.py

  sui-build:
    name: Sui Move tests and reproducible bytecode
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run verify:integrity
      - run: npm run verify:sui
      - run: python3 scripts/install-sui.py
      - run: npm run verify:sui-builds
      - run: npm run test:sui

  ton-build:
    name: Native TON reproducible builds and TVM execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run verify:ton
      - run: npm run verify:ton-builds
      - run: npm run test:ton

  bitcoin:
    name: Bitcoin scripts and synthetic transaction signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/bitcoin-protocol-v1/package-lock.json
      - run: node scripts/verify-bitcoin.mjs
      - run: npm ci --ignore-scripts --no-fund --prefix contracts/bitcoin-protocol-v1
      - run: npm run test:bitcoin
